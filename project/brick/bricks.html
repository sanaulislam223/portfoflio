<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Bricks Breaker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-wrapper">
        <div class="metrics-bar">
            <span id="score-card">SCORE: 0000</span>
            <span id="level-card">STAGE: 1</span>
            <span id="lives-display">LIVES: ❤️❤️❤️</span>
        </div>
        
        <canvas id="gameCanvas"></canvas>

        <div id="modal" class="panel">
            <h1 id="title">BRICK BREAKER</h1>
            <p id="subtitle">Move your mouse or slide your finger left/right to bounce the ball and break all neon bricks!</p>
            <button id="action-btn">START GAME</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
