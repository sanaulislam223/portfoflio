<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Dodger Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-wrapper">
        <div class="metrics-bar">
            <span id="score-card">SCORE: 0000</span>
            <span id="shield-card">SHIELD: 100%</span>
        </div>
        
        <canvas id="stage"></canvas>

        <!-- Naya Speed Control Section -->
        <div class="speed-controls">
            <button class="speed-btn" id="slow-btn">Slower</button>
            <div id="speed-indicator">SPEED: 7</div>
            <button class="speed-btn" id="fast-btn">Faster</button>
        </div>

        <div id="modal" class="panel">
            <h1 id="title">SPACE DODGER</h1>
            <p id="subtitle">Use LEFT / RIGHT arrow keys to navigate.</p>
            <button id="action-btn">LAUNCH MISSION</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
