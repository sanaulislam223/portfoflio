<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
        }

        .converter-box {
            background-color: #3b4cca;
            width: 450px;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            color: white;
        }

        h2 {
            margin-bottom: 25px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        label {
            font-weight: bold;
            font-size: 16px;
            width: 25%;
        }

        input, select {
            width: 70%;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            outline: none;
        }

        input {
            background-color: white;
            color: black;
        }

        select {
            background-color: #ff6b6b;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        select option {
            background-color: white;
            color: black;
        }

        .result-box {
            margin: 25px 0;
            font-size: 18px;
            font-weight: bold;
            min-height: 30px;
        }

        #convert-btn {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        #convert-btn:hover {
            background-color: #cc0000;
        }
		
		       .back-btn { display: inline-block; 
				margin-bottom: 15px; color: #fff; 
				text-decoration: none; 
				font-weight: bold; 
				font-size: 14px; }

    </style>
</head>
<body>

    <div class="converter-box">
	<a href="../index.html#project" class="back-btn">⬅ Back to Portfolio</a>

        <h2>Currency Converter</h2>
        
        <div class="input-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" value="1">
        </div>

        <div class="input-group">
            <label for="from-currency">From</label>
            <select id="from-currency">
                <!-- मुख्य देशों की लिस्ट पहले से मौजूद है ताकि यह खाली न दिखे -->
                <option value="INR" selected>INR - Indian Rupee</option>
                <option value="USD">USD - United States Dollar</option>
                <option value="EUR">EUR - Euro</option>
                <option value="GBP">GBP - British Pound</option>
                <option value="AED">AED - UAE Dirham</option>
                <option value="AUD">AUD - Australian Dollar</option>
                <option value="CAD">CAD - Canadian Dollar</option>
                <option value="CNY">CNY - Chinese Yuan</option>
                <option value="JPY">JPY - Japanese Yen</option>
                <option value="SAR">SAR - Saudi Riyal</option>
                <option value="SGD">SGD - Singapore Dollar</option>
            </select>
        </div>

        <div class="input-group">
            <label for="to-currency">Equals</label>
            <select id="to-currency">
                <option value="INR">INR - Indian Rupee</option>
                <option value="USD" selected>USD - United States Dollar</option>
                <option value="EUR">EUR - Euro</option>
                <option value="GBP">GBP - British Pound</option>
                <option value="AED">AED - UAE Dirham</option>
                <option value="AUD">AUD - Australian Dollar</option>
                <option value="CAD">CAD - Canadian Dollar</option>
                <option value="CNY">CNY - Chinese Yuan</option>
                <option value="JPY">JPY - Japanese Yen</option>
                <option value="SAR">SAR - Saudi Riyal</option>
                <option value="SGD">SGD - Singapore Dollar</option>
            </select>
        </div>

        <div class="result-box">
            <p id="result">Result will be shown here</p>
        </div>

        <button id="convert-btn">Convert</button>
    </div>

    <script>
        // दुनिया के अन्य सभी देशों की लिस्ट (बैकअप)
        const exchangeRatesBackup = {
            "INR": 1, "USD": 0.012, "EUR": 0.011, "GBP": 0.0094, "AED": 0.044,
            "AUD": 0.018, "CAD": 0.016, "CNY": 0.087, "JPY": 1.88, "SAR": 0.045, "SGD": 0.016
        };

        const amountInput = document.getElementById('amount');
        const fromCurrency = document.getElementById('from-currency');
        const toCurrency = document.getElementById('to-currency');
        const convertBtn = document.getElementById('convert-btn');
        const resultText = document.getElementById('result');

        async function convertCurrency() {
            const amount = amountInput.value;
            const from = fromCurrency.value;
            const to = toCurrency.value;

            if (amount === "" || amount <= 0) {
                resultText.innerText = "Please enter a valid amount";
                return;
            }

            resultText.innerText = "Converting...";

            try {
                // लाइव रेट लाने की कोशिश
                const response = await fetch(`https://er-api.com{from}`);
                if (!response.ok) throw new Error("API Network error");
                
                const data = await response.json();

                if (data.result === "success") {
                    const rate = data.rates[to];
                    const finalResult = (amount * rate).toFixed(2);
                    resultText.innerText = `${amount} ${from} = ${finalResult} ${to}`;
                } else {
                    throw new Error("API Data error");
                }
            } catch (error) {
                // अगर इंटरनेट या सुरक्षा कारणों से लाइव API काम नहीं करती, तो यह ऑफलाइन मोड में काम करेगा
                console.log("Using backup offline rates due to:", error.message);
                
                // ऑफलाइन कनवर्टर लॉजिक
                const fromRateInINR = exchangeRatesBackup[from];
                const toRateInINR = exchangeRatesBackup[to];
                
                if (fromRateInINR && toRateInINR) {
                    const finalResult = ((amount / fromRateInINR) * toRateInINR).toFixed(2);
                    resultText.innerText = `${amount} ${from} = ${finalResult} ${to} (Offline Mode)`;
                } else {
                    resultText.innerText = "Error standardizing conversion.";
                }
            }
        }

        convertBtn.addEventListener('click', convertCurrency);
    </script>
</body>
</html>
